# There is no Japanese model yet -- weights are filled in after training.
#weights_path: hf://...
#weights_path_without_voice_cloning: hf://...


flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 1024
    hidden_scale: 4
    max_period: 10000
    num_heads: 16
    num_layers: 24
  lookup_table:
    dim: 1024
    n_bins: 8000
    tokenizer: sentencepiece
    # Local training artifact, gitignored -- not resolved by load_config, so
    # this only works once data/ja/tokenizer.model exists after training.
    # Replaced with an hf:// URL at publication, like every released config's
    # tokenizer_path (see pocket_tts/config/italian_24l.yaml).
    tokenizer_path: data/ja/tokenizer.model
  #weights_path: partial.safetensors

mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
  #weights_path: codec.safetensors

# Japanese text handling. Every value is measured on the 1.4M-utterance corpus
# -- see docs/Japanese Model/specs/2026-08-27-japanese-text-frontend-design.md
text_normalizer: japanese
sentence_boundaries: ".!...?。…"   # 。 in 22.8% of lines, … ends 15.6% of them
clause_boundaries: ",;:、"          # 、 in 65.3% of lines
terminal_punctuation: ""            # 49.4% end unpunctuated; only 1.12% end in 。
segment_separator: ""               # Japanese is written without spaces
