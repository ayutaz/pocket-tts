# Phase 1: the validation run. Is the pipeline right, not is the model good.
#
# Identical to finetune_language_ja.yaml in everything that makes it Japanese --
# the tokenizer, its vocabulary, the missing word separator, the reset text
# embedding -- and different only in what makes it cheap. test_config_invariants
# pins that split: drift in the Japanese half and this run validates a model
# nobody will train.
#
# What it costs: 15k steps is about 2.2 h on one H100, or a few hours on a 24 GB
# card, and under $10 either way. Production is 250k steps and 36 h; run
# finetune_language_ja.yaml for that, not this.
#
# Prepare the inputs first (see docs/Japanese Model/training-strategy.md phase 1):
#   uv sync --group japanese
#   # data/ja/ is gitignored -- copy tokenizer.model onto the instance, or rebuild
#   # it with the prepare_ja_text + train_tokenizer commands in
#   # finetune_language_ja.yaml's header
#   uv run python -m training.scripts.prepare_moespeech --hours 124 --out data/ja
#   # that stops at probe.json; read it, then re-run with the two cutoffs
model_config: pocket_tts/config/english_2026-04_24l.yaml
model_overrides:
  flow_lm.lookup_table.tokenizer_path: data/ja/tokenizer.model
  # Measured on 1.4M deduplicated GOL + MoeSpeech utterances: 4092 distinct
  # characters after normalization. sentencepiece spends one vocabulary slot per
  # character at character_coverage 1.0 and fails outright below that count, so
  # the released 4000 cannot be used; the surplus over 4092 is what becomes
  # merges. 8000 measured 1.805 chars/token against 1.658 at 6000 and 1.961 at
  # 12000, and leaves headroom for the characters the remaining MoeSpeech
  # speakers will add. Must equal the tokenizer's vocab size exactly.
  flow_lm.lookup_table.n_bins: 8000
start_from_pretrained: true
reset_text_embedding: true  # the Japanese tokenizer is not the one these weights were trained with

data:
  train_jsonl: data/ja/train_aligned.jsonl
  valid_jsonl: data/ja/valid_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0
  # Japanese is written without spaces. align_data.py --segmenter japanese
  # splits the transcript into words the writing system does not separate, so
  # the loader has to put them back with nothing between them -- otherwise the
  # model trains on spaced text that no user will ever type.
  word_separator: ""

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 2e-4
  schedule: constant
  warmup_steps: 1000

# Its own directory, so a validation run cannot overwrite production
# checkpoints. latest_checkpoint() resumes from whatever is newest in run_dir,
# and a 15k-step run left there would silently become production's starting
# point on the next resume.
run_dir: runs/finetune_language_ja_phase1

# 16 x 4 = 64 rows per optimizer step, the same effective batch production uses
# through batch_size 64 alone. Split this way it fits a 24 GB card, which is
# what this phase is meant to be rented on. Below 64 the acoustic-quality
# transition arrives late or not at all, so a cheaper split would validate
# nothing.
batch_size: 16
grad_accum_steps: 4

# 15k, not production's 250k. The README puts the WER plateau at about 15k;
# everything after it buys acoustic quality, which is not what this run is
# asking about. train.py takes a config path and nothing else -- there is no
# --max-steps -- so this number is the only thing that stops the run.
max_steps: 15000

stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500  # the last one written is checkpoint_00015000.pt
num_ckpt_keep: 3
sample_cfg_coef: 2.0

# Every 500 steps, not the default 10000. The documented tripwire is an ear
# judgement at 2-3k steps -- if there is no Japanese-sounding phonology by then
# the pipeline is broken and stopping costs about $2. At 10000 the first wav
# arrives after 1.45 h, by which point the tripwire has nothing left to save.
# Samples land in runs/finetune_language_ja_phase1/samples/.
sample_freq: 500

# The English defaults would write meaningless wavs every sample_freq steps.
sample_sentences:
  - こんにちは、今日はいい天気ですね。
  - 昨夜からずっと気配を探られていたか。
  - すみません、この近くにコンビニはありますか。
